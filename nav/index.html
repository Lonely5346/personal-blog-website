<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空门苍 · 小站导航</title>
<meta name="description" content="空门苍的个人小站导航页，聚合博客等子域名入口。">
<style>
  :root {
    --accent: #f4a6b8;
    --accent-deep: #e8839b;
    --accent-soft: rgba(244, 166, 184, 0.16);
    --grad: linear-gradient(135deg, #fbe3ea 0%, #f7c4d0 50%, #e4f3fb 100%);
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #2c3e50;
    --text-2: #7a8699;
    --border: #eceef2;
    --shadow: 0 4px 18px rgba(60, 64, 84, 0.08);
    --shadow-hover: 0 10px 30px rgba(60, 64, 84, 0.16);
    --radius: 16px;
    --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC",
      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  [data-theme="dark"] {
    --grad: linear-gradient(135deg, #232429 0%, #2a2330 50%, #1c1d22 100%);
    --bg: #17181c;
    --card: #1f2026;
    --text: #e6e6e6;
    --text-2: #9aa3b2;
    --border: #2e3038;
    --shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    --shadow-hover: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    min-height: 100vh;
    background: var(--grad);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .petal {
    position: fixed;
    top: -40px;
    width: 14px;
    height: 14px;
    background: radial-gradient(circle at 30% 30%, #ffd6e0, #f4a6b8);
    border-radius: 100% 0 100% 0;
    opacity: 0.55;
    pointer-events: none;
    animation: fall linear infinite;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(540deg); }
  }
  .wrap { width: 100%; max-width: 860px; text-align: center; }
  .hero { margin-bottom: 36px; position: relative; }
  .avatar {
    width: 96px; height: 96px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.8);
    box-shadow: var(--shadow);
  }
  h1 { margin-top: 14px; font-size: 28px; letter-spacing: 2px; }
  .slogan { margin-top: 6px; color: var(--text-2); font-size: 15px; }
  .toggle {
    position: absolute;
    right: 0; top: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 40px; height: 40px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.2s ease;
  }
  .toggle:hover { transform: scale(1.1); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
  }
  .card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 26px 22px;
    text-align: left;
    text-decoration: none;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  a.card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-hover);
    color: var(--text);
  }
  .card .icon { font-size: 34px; }
  .card h2 { margin-top: 12px; font-size: 20px; }
  .card p { margin-top: 6px; color: var(--text-2); font-size: 14px; line-height: 1.6; }
  .card .domain {
    margin-top: 12px;
    display: inline-block;
    font-size: 12px;
    color: var(--accent-deep);
    background: var(--accent-soft);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .card.soon { opacity: 0.55; cursor: default; }
  .card.soon .badge {
    position: absolute;
    top: 14px; right: 14px;
    font-size: 12px;
    color: #fff;
    background: var(--accent);
    border-radius: 20px;
    padding: 2px 10px;
  }
  .footer {
    margin-top: 40px;
    color: var(--text-2);
    font-size: 13px;
  }
  .footer a { color: var(--accent-deep); text-decoration: none; margin: 0 8px; }
  .footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <button class="toggle" id="themeToggle" title="切换主题" aria-label="切换主题">🌙</button>
      <img class="avatar" src="avatar.jpg" alt="空门苍头像">
      <h1>空门苍</h1>
      <p class="slogan">念念不忘，必有回响。</p>
    </header>

    <section class="grid" id="grid"></section>

    <footer class="footer">
      <a href="https://github.com/Lonely5346" target="_blank" rel="noopener">GitHub</a>
      <a href="mailto:1816182085@qq.com">Email</a>
      <a href="https://blog.lonely5346.cn/rss.xml" target="_blank" rel="noopener">RSS</a>
    </footer>
  </main>

<script>
  // ============================================================
  // ✨ 子域名入口配置：以后新增子域名，复制一个对象加进数组即可
  //    status: "online" = 正常入口（可点击跳转）
  //    status: "soon"   = 敬请期待（置灰展示，方便预留位置）
  // ============================================================
  const SITES = [
    {
      name: "苍の博客",
      desc: "爱折腾的空门苍，记录教程、笔记与踩坑日常",
      url: "https://blog.lonely5346.cn",
      domain: "blog.lonely5346.cn",
      icon: "📝",
      status: "online",
    },
    // 示例：以后新增子域名，照着下面这样加一个对象即可
    // {
    //   name: "相册",
    //   desc: "摄影与生活记录",
    //   url: "https://photos.lonely5346.cn",
    //   domain: "photos.lonely5346.cn",
    //   icon: "📷",
    //   status: "soon",
    // },
    {
      name: "更多服务",
      desc: "其他子域名正在路上，敬请期待",
      url: "#",
      domain: "*.lonely5346.cn",
      icon: "🚧",
      status: "soon",
    },
  ];

  const grid = document.getElementById("grid");
  SITES.forEach((s) => {
    const card = document.createElement("a");
    card.className = "card" + (s.status === "soon" ? " soon" : "");
    if (s.status === "online") card.href = s.url;
    if (s.status === "online") card.target = "_blank";
    card.rel = "noopener";
    if (s.status === "soon") {
      card.href = "#";
      card.setAttribute("aria-disabled", "true");
    }
    card.innerHTML =
      '<span class="icon">' + s.icon + "</span>" +
      (s.status === "soon" ? '<span class="badge">敬请期待</span>' : "") +
      "<h2>" + s.name + "</h2>" +
      "<p>" + s.desc + "</p>" +
      '<span class="domain">' + s.domain + "</span>";
    grid.appendChild(card);
  });

  // 漂浮樱花
  const petalCount = 14;
  for (let i = 0; i < petalCount; i++) {
    const p = document.createElement("div");
    p.className = "petal";
    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = 8 + Math.random() * 10 + "s";
    p.style.animationDelay = -Math.random() * 15 + "s";
    p.style.transform = "scale(" + (0.6 + Math.random() * 0.8) + ")";
    document.body.appendChild(p);
  }

  // 亮 / 暗主题切换（记忆用户选择）
  const toggle = document.getElementById("themeToggle");
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    toggle.textContent = t === "dark" ? "☀️" : "🌙";
    try { localStorage.setItem("nav-theme", t); } catch (e) {}
  }
  let saved = "light";
  try { saved = localStorage.getItem("nav-theme") || "light"; } catch (e) {}
  applyTheme(saved);
  toggle.addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme");
    applyTheme(cur === "dark" ? "light" : "dark");
  });
</script>
</body>
</html>
